name: Build Android APK

# Runs independently of the Windows and iOS workflows — a failure here cannot
# affect those builds, and vice versa.
#
# Actions tab -> "Build Android APK" -> "Run workflow".

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Attach the APK to a GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    uses: ./.github/workflows/_build-web.yml

  apk:
    name: Package APK
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: actions/download-artifact@v4
        with:
          name: viewer-dist
          path: packaging/mobile/www

      - name: Install Capacitor
        working-directory: packaging/mobile
        run: npm install

      - name: Add Android platform
        working-directory: packaging/mobile
        run: npx cap add android

      - name: Generate launcher icons and splash
        working-directory: packaging/mobile
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0c1a26' --splashBackgroundColor '#0c1a26'

      - name: Sync web assets into the Android project
        working-directory: packaging/mobile
        run: npx cap sync android

      # Signing is optional. With ANDROID_KEYSTORE_BASE64 set in repo secrets we
      # produce a release-signed APK; otherwise a debug-signed one, which
      # sideloads fine but cannot go on the Play Store. The check lives inside
      # `run` because the secrets context is not dependable in step `if:`.
      - name: Decode release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > packaging/mobile/android/release.keystore
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore found — building a signed APK."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No keystore secret — building a debug-signed APK (sideloadable)."
          fi

      - name: Build signed release APK
        if: ${{ steps.keystore.outputs.present == 'true' }}
        working-directory: packaging/mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/CBCT-Viewer.apk"

      - name: Build debug APK
        if: ${{ steps.keystore.outputs.present != 'true' }}
        working-directory: packaging/mobile/android
        run: |
          ./gradlew assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/CBCT-Viewer.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CBCT-Viewer-android
          path: out/CBCT-Viewer.apk
          retention-days: 30

      # Surfaces the commit in the release title. A *re-run* of an existing run
      # keeps the same run_number AND replays the same old commit, so it
      # silently overwrites the earlier release with an identical build. Showing
      # the short SHA makes that visible at a glance in the releases list.
      - name: Short commit sha
        id: sha
        shell: bash
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Android build ${{ github.run_number }} — ${{ steps.sha.outputs.short }}
          files: out/CBCT-Viewer.apk
          fail_on_unmatched_files: false
          body: |
            Android APK from `${{ github.sha }}`.

            Download the `.apk` on your phone, allow "install unknown apps" for
            your browser when prompted, then tap the file to install.

            On mobile use the **multi-file picker**, not "load folder" —
            directory selection relies on `webkitdirectory`, which Android's
            WebView does not support.

            ---
            **Not a certified medical device.** This build has not been cleared
            by the FDA, under EU MDR, or by any other regulator, and the quality
            presets deliberately reduce image fidelity to fit constrained
            hardware. Do not use it as the sole basis for diagnosis or treatment
            planning.
